<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICE - Intelligent Resume Summarizer</title>
    <meta name="description" content="Upload a Resume and receive a concise, bullet-point summary instantly.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1 class="logo">SICE</h1>
            <p class="subtitle">Serverless Intelligent Content Engine</p>
        </header>

        <!-- Main Content Area -->
        <main>
            <!-- Upload Section -->
            <section class="upload-section glass-panel" id="upload-section">
                <div class="drop-zone" id="drop-zone">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    </div>
                    <h2>Upload your Resume</h2>
                    <p>Drag & drop your file here, or click to browse</p>
                    <input type="file" id="file-input" accept="application/pdf" hidden>
                    <button class="btn-primary" onclick="document.getElementById('file-input').click()">Select File</button>
                </div>
            </section>

            <!-- Loading State -->
            <div class="loading-state hidden" id="loading-state">
                <div class="spinner"></div>
                <p id="loading-text">Extracting text from Resume...</p>
            </div>

            <!-- Results Section -->
            <section class="results-section glass-panel hidden" id="results-section">
                <h2>Summary <span class="badge">Amazon Nova Micro</span></h2>
                <div class="summary-content" id="summary-content">
                    <!-- Bullet points injected here -->
                </div>
                <button class="btn-secondary" id="reset-btn">Summarize Another</button>
            </section>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
